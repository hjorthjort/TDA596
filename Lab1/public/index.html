<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 1</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚀%3C/text%3E%3C/svg%3E"
  </head>
  <body>
    <main>
      <h1>File server test</h1>
      <noscript>Enable JavaScript to submit raw text and image files.</noscript>

      <h2>Text files</h2>
      <div class="grid">
        <section class="card">
          <h3><a href="/text/UTF-8-demo.txt">UTF-8-demo.txt</a></h3>
          <iframe src="/text/UTF-8-demo.txt"></iframe>
          <form action="/text/UTF-8-demo.txt" method="post">
            <label>Path under public/ <input name="filename" value="text/UTF-8-demo.txt" required></label>
            <label>New text <textarea name="text" rows="5"></textarea></label>
            <button type="submit">Submit</button>
            <output aria-live="polite"></output>
          </form>
        </section>
      </div>

      <h2>Images</h2>
      <p class="note">Photos in three file formats. Click to open full-size
        image.</p>
      <div class="grid">
        <figure class="card">
          <a href="/images/image.jpg">
            <h3>images/image.jpg</h3>
            <img src="/images/image.jpg" alt="Coastal photo in JPG format">
            <code>image/jpeg</code>
          </a>
          <form action="/images/image.jpg" method="post">
            <label>Replace JPG <input name="file" type="file" accept=".jpg,.jpeg,image/jpeg" required></label>
            <button type="submit">Submit</button>
            <output aria-live="polite"></output>
          </form>
        </figure>
        <figure class="card">
          <a href="/images/image.jpeg">
            <h3>images/image.jpeg</h3>
            <img src="/images/image.jpeg" alt="Coastal photo in JPEG format">
            <code>image/jpeg</code>
          </a>
          <form action="/images/image.jpeg" method="post">
            <label>Replace JPEG <input name="file" type="file" accept=".jpg,.jpeg,image/jpeg" required></label>
            <button type="submit">Submit</button>
            <output aria-live="polite"></output>
          </form>
        </figure>
        <figure class="card">
          <a href="/images/image.gif">
            <h3>images/image.gif</h3>
            <img src="/images/image.gif" alt="Coastal photo in GIF format">
            <code>image/gif</code>
          </a>
          <form action="/images/image.gif" method="post">
            <label>Replace GIF <input name="file" type="file" accept=".gif,image/gif" required></label>
            <button type="submit">Submit</button>
            <output aria-live="polite"></output>
          </form>
        </figure>
      </div>
    </main>
    <script>
      for (const form of document.querySelectorAll("form")) {
        form.onsubmit = async event => {
          event.preventDefault();
          const fields = form.elements;
          const response = await fetch(fields.filename?.value || form.action, {
            method: "POST",
            body: fields.file ? fields.file.files[0] : fields.text.value
          });
          form.querySelector("output").textContent = `HTTP ${response.status}`;
        };
      }
    </script>
  </body>
</html>
